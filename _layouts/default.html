---
layout: compress
---

{% if site.data.env.need_visit_count %}
    {% include visit_count.php %}
{% endif %}

<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- = = = = = = = = -->
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta name="description" content="{{ page.SEO_DESCRIPTION | escape }}{{ site.data.env.description }}" />
    <meta name="keywords" content="{{ page.SEO_KEYWORDS | escape }}{{ site.data.env.keywords }}" />
    <meta name="generator" content="Jekyll v{{ jekyll.version }}" />

    {% include favicon_head.html %}

    <title>{{ page.SEO_TITLE }} | {{ site.data.env.title }}</title>
    <!-- < < < < < < < < CSS -->
    <link rel="stylesheet" href="/nodejs/bootstrap/node_modules/bootstrap/dist/css/bootstrap.min.css" />
    <script src="/nodejs/bootstrap/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="/nodejs/bootstrap-icons/node_modules/bootstrap-icons/font/bootstrap-icons.min.css" />
   
    {% if jekyll.environment == "production" %}
        <link rel="stylesheet" href="/styles.css?v={{ site.time | date: '%Y-%m-%d_%H-%M' }}" />
    {% else %}
        <link rel="stylesheet" href="/styles.css" />
    {% endif %}
    <!-- CSS > > > > > > > > -->
</head>

<body>
    {{ content }}
</body>

</html>
